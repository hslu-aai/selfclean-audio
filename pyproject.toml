[build-system]
requires = ["setuptools>=64", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "selfclean-audio"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
description = "SelfClean for Audio files."
dependencies = [
    "pyyaml",
		"torch==2.6.0",
		"torchaudio==2.6.0",
		"torchvision==0.21.0",
		"tqdm==4.67.1",
		"loguru==0.7.3",
		"omegaconf==2.3.0",
		"hydra-core==1.3.2",
		"pandas==2.2.3",
		"tensordict==0.7.2",
		"scikit-learn",
		"scienceplots",
		"seaborn",
		"einops",
		"torchinfo",
		"timm",
		"transformers",
		"nnAudio",
		"pyod>=1.0.0",
		"cleanlab[datalab]>=2.4.0",
		"psycopg2-binary",
		"annoy",
		"wandb",
		"peft",
		"PyDejavu-Rollong",
		"librosa",
]
dynamic = ["version"]
license.file = "LICENSE"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "copier",
    "jupyter",
    "myst-parser",
    "pipdeptree",
    "pre-commit",
    "pydata-sphinx-theme>=0.12",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-design",
    "tox",
    "tox-direct",
    "types-mock",
]

[project.scripts]
selfclean-audio = "selfclean_audio.__main__:main"

[project.urls]
GitHub = "https://github.com/hslu-aai/selfclean-audio"

[[project.authors]] # Further authors may be added by duplicating this section
email = "alvaro.gonzalezjimenez@hslu.ch"
name = "Alvaro Gonzalez-Jimenez"


[tool.setuptools_scm]
version_file = "src/selfclean_audio/_version.py"

[tool.pyright]
typeCheckingMode = "basic"  # Less strict than "standard"
reportMissingImports = false # Ignore missing stubs in imported modules
reportMissingModuleSource = false # Ignore missing source for installed packages
reportUnknownArgumentType = false # Don't complain about Any/Unknown arguments
reportUnknownMemberType = false # Don't complain about Any/Unknown attributes
reportUnknownVariableType = false # Don't complain about Any/Unknown variables
reportArgumentType = "warning" # Make argument type mismatches warnings instead of errors
reportAttributeAccessIssue = "warning" # Make attribute access issues warnings
reportCallIssue = "warning" # Make call issues warnings
reportReturnType = "warning" # Make return type mismatches warnings
exclude = ["src/SelfClean"]


[tool.pytest.ini_options]
# Run pytest with all our checkers, and don't spam us with massive tracebacks on error
addopts = """
    --tb=native -vv --doctest-modules --doctest-glob="*.rst"
    --ignore=tests/selfclean --ignore=src/SelfClean
    """
# https://iscinumpy.gitlab.io/post/bound-version-constraints/#watch-for-warnings
filterwarnings = [
    "error",
    "ignore::FutureWarning:.*timm.models.layers.*",
    "ignore::pydantic.warnings.UnsupportedFieldAttributeWarning"
]
# Doctest python code in docs, python code in src docstrings, test functions in tests
testpaths = [
  "src/selfclean_audio",
  "tests"
]
norecursedirs = ["src/SelfClean"]

[tool.coverage.run]
data_file = "/tmp/selfclean_audio.coverage"
source = ["src/selfclean_audio"]


[tool.coverage.paths]
# Tests are run from installed location, map back to the src directory
source = ["src", "**/site-packages/"]

# tox must currently be configured via an embedded ini string
# See: https://github.com/tox-dev/tox/issues/999
[tool.tox]
legacy_tox_ini = """
[tox]
envlist = pre-commit, type-checking, tests, docs, build
isolated_build = true

[testenv]
deps =
    -e .[dev]
passenv =
    CI
    GITHUB_*
    CODECOV_*
setenv =
    PYTHONPATH = {toxinidir}/src
    # https://github.com/pytest-dev/pytest/issues/2042
    PY_IGNORE_IMPORTMISMATCH = 1
    MKL_THREADING_LAYER = GNU
    MKL_SERVICE_FORCE_INTEL = 1

[testenv:pre-commit]
deps = pre-commit
skip_install = true
commands = pre-commit run --all-files --show-diff-on-failure {posargs}

[testenv:type-checking]
deps =
    -e .[dev]
    pyright
commands = pyright src tests {posargs}

[testenv:tests]
deps =
    -e .[dev]
    pytest
    pytest-cov
commands = pytest --cov=src/selfclean_audio --cov-report=term-missing:skip-covered --cov-report=xml:cov.xml {posargs}

[testenv:docs]
deps =
    -e .[dev]
allowlist_externals = sphinx-build
commands = sphinx-build -E --keep-going -T docs build/html {posargs}

[testenv:build]
deps =
    build
    twine
skip_install = true
commands =
    python -m build
    twine check --strict dist/*
"""

[tool.ruff]
src = ["src", "tests"]
line-length = 88
extend-exclude = [
    "docs/_api",
    "src/selfclean_audio/_version.py",
]
[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
    "F",   # pyflakes rules - https://docs.astral.sh/ruff/rules/#pyflakes-f
    "W",   # pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
    "I",   # isort - https://docs.astral.sh/ruff/rules/#isort-i
]
ignore = [
    "E501",  # Line too long (let formatter handle this)
    "E203",  # Whitespace before ':' (black compatibility)
]

[tool.ruff.lint.per-file-ignores]
# By default, private member access is allowed in tests
# See https://github.com/DiamondLightSource/python-copier-template/issues/154
# Remove this line to forbid private member access in tests
"tests/**/*" = ["SLF001"]
"src/SelfClean/**/*" = ["ALL"]
